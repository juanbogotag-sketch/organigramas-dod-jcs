<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eventos — Calendario semanal · Repositorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', Arial, sans-serif; background: #f2f4f8; color: #16283f; }
  .tricolor { height: 7px; background: linear-gradient(90deg, #FCD116 0 33.4%, #003893 33.4% 66.7%, #CE1126 66.7% 100%); }
  header { background: #0a1d38; color: #fff; padding: 26px 18px 20px; position: relative; overflow: hidden; }
  header .watermark { position: absolute; right: -30px; top: 50%; transform: translateY(-50%); height: 190%; opacity: .10; pointer-events: none; }
  header h1 { font-size: clamp(24px, 5vw, 36px); font-weight: 800; position: relative; }
  header p { margin-top: 6px; font-size: 13.5px; color: #c8d5e6; font-weight: 600; position: relative; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 14px 44px; }
  .volver { display: inline-block; background: #0a1d38; color: #fff; text-decoration: none; font-weight: 700; font-size: 13.5px; padding: 10px 16px; border-radius: 999px; margin-bottom: 16px; }
  .navsemana { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .navsemana h2 { flex: 1 1 auto; text-align: center; font-size: clamp(16px, 3.4vw, 21px); font-weight: 800; color: #0a1d38; text-transform: capitalize; }
  .navbtn { border: 2px solid #0a1d38; background: #fff; color: #0a1d38; font: 700 13.5px 'Montserrat', sans-serif; padding: 10px 15px; border-radius: 999px; cursor: pointer; }
  .navbtn.hoy { background: #e0a800; border-color: #e0a800; color: #0a1d38; }
  .semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  @media (max-width: 860px) { .semana { grid-template-columns: 1fr; } }
  .dia { background: #fff; border-radius: 14px; padding: 13px 12px 15px; min-height: 118px; box-shadow: 0 2px 8px rgba(10,29,56,.07); border-top: 4px solid #c9d4e4; display: flex; flex-direction: column; }
  .dia.eshoy { border-top-color: #e0a800; box-shadow: 0 4px 16px rgba(224,168,0,.35); }
  .dia .dnombre { font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: #5a6b82; }
  .dia .dnum { font-size: 27px; font-weight: 800; color: #0a1d38; line-height: 1.15; }
  .dia .hoybadge { align-self: flex-start; background: #e0a800; color: #0a1d38; font-size: 10.5px; font-weight: 800; padding: 2.5px 9px; border-radius: 999px; margin: 2px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
  .dia .sinev { margin-top: auto; font-size: 12px; color: #9fb0c6; font-weight: 600; }
  .evento { display: block; margin-top: 10px; background: #0a1d38; color: #fff; text-decoration: none; border-radius: 12px; padding: 12px 12px 11px; border-left: 5px solid #FCD116; }
  .evento:hover { background: #12294d; }
  .evento .enombre { font-weight: 800; font-size: 14.5px; line-height: 1.3; }
  .evento .edato { font-size: 12px; font-weight: 600; color: #c8d5e6; margin-top: 4px; line-height: 1.45; }
  .evento .ecta { display: inline-block; margin-top: 9px; background: #e0a800; color: #0a1d38; font-size: 12px; font-weight: 800; padding: 6px 11px; border-radius: 999px; }
  .nota { text-align: center; color: #7b8aa0; font-size: 12.5px; font-weight: 600; margin-top: 18px; }
  .crearbtn { display: block; max-width: 340px; margin: 20px auto 0; background: #0a1d38; color: #fff; text-decoration: none; text-align: center; font-weight: 800; font-size: 15px; padding: 14px 20px; border-radius: 999px; }
  .crearbtn:hover { background: #12294d; }
  .evbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  .evbtns .crearbtn { flex: 1 1 220px; margin: 0; }
  .crearbtn.sec { background: #fff; color: #0a1d38; border: 2px solid #0a1d38; }
  .crearbtn.sec:hover { background: #eef1f3; }
</style>
</head>
<body>
<div class="tricolor"></div>
<header>
  <img class="watermark" id="escudo" alt="">
  <h1>📅 Eventos</h1>
  <p>Calendario semanal · Embajada de Colombia en Estados Unidos</p>
</header>
<main>
  <a class="volver" href="repositorio.html">← Volver al Repositorio</a>
  <div class="navsemana">
    <button class="navbtn" id="btnPrev" type="button">◀ Semana anterior</button>
    <h2 id="tituloSemana"></h2>
    <button class="navbtn hoy" id="btnHoy" type="button">Esta semana</button>
    <button class="navbtn" id="btnNext" type="button">Semana siguiente ▶</button>
  </div>
  <div class="semana" id="semana"></div>
  <div class="evbtns">
    <a class="crearbtn" href="repositorio.html?crear=1">🎉 Crear evento</a>
    <a class="crearbtn sec" href="proyectos.html">📁 Proyectos de eventos</a>
  </div>
  <p class="nota">Toca un evento para abrirlo: su checklist de asistencia o su lista de invitados en el Repositorio.</p>
</main>
<script src="js/logo.js"></script>
<script>
// Eventos del calendario. Para agregar uno: nombre, fecha (AAAA-MM-DD), hora, lugar y la página a la que lleva el botón.
const EVENTOS = [
  { fecha: '2026-11-19', nombre: 'Life After the Hippopotamus', hora: '6:30 – 8:00 p. m.', lugar: 'Residencia de la Embajadora de Colombia', enlace: 'hipopotamo.html', cta: '📋 Checklist de asistencia' }
];
// Eventos creados en el Repositorio (este dispositivo): se leen de
// localStorage y aparecen en el casillero del día de su fecha.
function eventosGuardados() {
  try {
    const list = JSON.parse(localStorage.getItem('torio_eventos_v1') || '[]');
    if (!Array.isArray(list)) return [];
    return list.filter(e => e && e.id && e.date).map(e => {
      const keys = new Set((e.guests || []).filter(g => g && g.key).map(g => g.key));
      const ext = (e.externals || []).filter(x => x && x.fn && x.ln).length;
      return { fecha: e.date, nombre: e.name || 'Evento sin nombre', hora: '', lugar: e.place || '', enlace: 'repositorio.html?evento=' + encodeURIComponent(e.id), cta: '✎ Abrir evento', invitados: keys.size + ext };
    });
  } catch (err) { return []; }
}
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (window.LOGO_EMB) { $('escudo').src = LOGO_EMB; }

function lunesDe(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
let lunes = lunesDe(new Date());

function render() {
  const dias = [];
  for (let i = 0; i < 7; i++) { const d = new Date(lunes); d.setDate(lunes.getDate() + i); dias.push(d); }
  const ini = dias[0], fin = dias[6];
  $('tituloSemana').textContent = ini.getMonth() === fin.getMonth()
    ? ini.getDate() + ' – ' + fin.getDate() + ' de ' + MESES[ini.getMonth()] + ' de ' + ini.getFullYear()
    : ini.getDate() + ' de ' + MESES[ini.getMonth()] + ' – ' + fin.getDate() + ' de ' + MESES[fin.getMonth()] + ' de ' + fin.getFullYear();
  const hoyIso = iso(new Date());
  const todos = EVENTOS.concat(eventosGuardados());
  const cont = $('semana');
  cont.innerHTML = '';
  dias.forEach((d, i) => {
    const f = iso(d);
    const esHoy = f === hoyIso;
    const evs = todos.filter(e => e.fecha === f);
    const card = document.createElement('div');
    card.className = 'dia' + (esHoy ? ' eshoy' : '');
    let html = '<div class="dnombre">' + DIAS[i] + '</div><div class="dnum">' + d.getDate() + '</div>' + (esHoy ? '<span class="hoybadge">Hoy</span>' : '');
    if (evs.length) {
      for (const e of evs) {
        const dato = [e.hora, e.lugar].filter(Boolean).map(esc).join('<br>');
        const extra = (e.invitados != null) ? (e.invitados + (e.invitados === 1 ? ' invitado' : ' invitados')) : '';
        html += '<a class="evento" href="' + esc(e.enlace) + '"><div class="enombre">' + esc(e.nombre) + '</div><div class="edato">' + dato + (extra ? '<br>' + esc(extra) : '') + '</div><span class="ecta">' + esc(e.cta) + '</span></a>';
      }
    } else {
      html += '<div class="sinev">Sin eventos</div>';
    }
    card.innerHTML = html;
    cont.appendChild(card);
  });
}
$('btnPrev').addEventListener('click', () => { lunes.setDate(lunes.getDate() - 7); render(); });
$('btnNext').addEventListener('click', () => { lunes.setDate(lunes.getDate() + 7); render(); });
$('btnHoy').addEventListener('click', () => { lunes = lunesDe(new Date()); render(); });
render();
</script>
</body>
</html>

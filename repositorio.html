<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Repositodo · Embajada de Colombia en Estados Unidos</title>
  <link rel="stylesheet" href="css/repositorio.css?v=3">
</head>

<body>
  <div id="gate" hidden>
    <div class="gcard">
      <h2>Repositodo</h2>
      <p>Para entrar, escribe tu nombre completo.</p>
      <label for="gname">Nombre completo</label>
      <input id="gname" type="text" autocomplete="name" placeholder="Tu nombre">
      <button id="gbtn" class="p" disabled>Entrar</button>
    </div>
  </div>

  <img id="wm" alt="" hidden>

  <header>
    <h1>Repositodo</h1>
    <p class="emb">Embajada de Colombia en Estados Unidos</p>
    <p id="subtitle">Base de datos de perfiles</p>
    <div class="hlinks">
      <a class="hbtn" href="index.html">Ir al organigrama interactivo del Poder Ejecutivo</a>
      <button type="button" class="hbtn" id="btnAliados">Aliados en el Congreso</button>
      <button type="button" class="hbtn off" id="btnLeg" disabled title="En desarrollo">Ir al Poder Legislativo</button>
      <button type="button" class="hbtn" id="btnSug">Sugerencias</button>
    </div>
  </header>

  <main>
    <section id="home">
      <div class="cols">
        <div class="col" id="colL"></div>
        <div class="col" id="colR"></div>
      </div>
      <footer id="foot"><img id="footlogo" alt="Embajada de Colombia en Estados Unidos">
        <p id="credit">Repositorio y organigrama creado por el pasante Juan Pablo González Bogotá</p>
      </footer>
    </section>

    <section id="listview" hidden>
      <button id="back" type="button">← Volver a las categorías</button>
      <h2 id="catTitle"></h2>
      <div class="frow">
        <input id="q" type="search" placeholder="Buscar por nombre, cargo u organización…" autocomplete="off"
          aria-label="Buscar en esta categoría">
        <select id="fsub" aria-label="Filtrar por subgrupo (departamento u oficina)">
          <option value="">Todos los subgrupos</option>
        </select>
      </div>
      <div class="frow2" id="frow2" hidden>
        <span class="sub2lab">Subgrupo:</span>
        <select id="fsub2" aria-label="Filtrar por subgrupo de segundo nivel">
          <option value="">Todos</option>
        </select>
      </div>
      <div id="groups"></div>
      <p id="empty" hidden></p>
    </section>
  </main>

  <div id="modal" hidden role="dialog" aria-modal="true" aria-label="Perfil">
    <div class="mbox">
      <button id="mx" type="button" aria-label="Cerrar perfil">✕ Cerrar</button>
      <div class="mhead">
        <img id="mph" alt="">
        <div>
          <h2 id="mname"></h2>
          <div id="mtitle"></div>
          <div id="morg"></div>
          <div id="mdep"></div>
        </div>
      </div>
      <div class="langrow" role="group" aria-label="Idioma del perfil">
        <button type="button" data-l="es" class="on">Español</button>
        <button type="button" data-l="en">English</button>
      </div>
      <div id="mtext"></div>
      <div class="mrow">
        <button id="mword" type="button" class="p">Descargar en Word</button>
        <button id="mback" type="button">Volver a la lista</button>
      </div>
      <p id="mmsg"></p>
    </div>
  </div>

  <div id="sug" hidden role="dialog" aria-modal="true" aria-label="Sugerencias">
    <div class="mbox">
      <button id="sugx" type="button" aria-label="Cerrar">✕ Cerrar</button>
      <h2 class="sugtitle">Sugerencias</h2>
      <div id="sugStep1">
        <button type="button" class="p sugopt" id="sugOpt">Sugerir perfiles</button>
      </div>
      <form id="sugForm" hidden>
        <label for="sugText">Pega aquí el texto de tu sugerencia. Puedes poner lo que sea.</label>
        <textarea id="sugText" rows="10" placeholder="Pega o escribe aquí el texto…"></textarea>
        <div class="mrow">
          <button type="submit" class="p" id="sugSend" disabled>Enviar</button>
          <button type="button" id="sugBack">Volver</button>
        </div>
        <p id="sugMsg"></p>
      </form>
    </div>
  </div>

  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/vendor/docx.min.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/photos_ct.js"></script>
  <script src="js/datos_ct.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/repositorio.js?v=3"></script>
</body>

</html>

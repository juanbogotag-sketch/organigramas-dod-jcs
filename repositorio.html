<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Torio · Embajada de Colombia en Estados Unidos</title>
  <link rel="stylesheet" href="css/repositorio.css?v=12">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1d38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Torio">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>

<body>
  <div class="tricolor" aria-hidden="true"></div>
  <div id="gate" hidden>
    <div class="gcard">
      <h2>Torio</h2>
      <p>Para entrar, escribe tu nombre completo.</p>
      <label for="gname">Nombre completo</label>
      <input id="gname" type="text" autocomplete="name" placeholder="Tu nombre">
      <button id="gbtn" class="p" disabled>Entrar</button>
    </div>
  </div>

  <img id="wm" alt="" hidden>

  <header>
    <h1>Torio</h1>
    <p class="emb">Embajada de Colombia en Estados Unidos</p>
    <p id="subtitle">Base de datos de perfiles</p>
    <div class="hlinks">
      <button type="button" class="hbtn" id="btnLeg" onclick="location.href='congreso.html'">Ir al Poder Legislativo</button>
    </div>
  </header>

  <main>
    <section id="home">
      <div class="cols">
        <div class="col" id="colL"></div>
        <div class="col" id="colR"></div>
      </div>
      <footer id="foot"><img id="footlogo" alt="Embajada de Colombia en Estados Unidos">
      </footer>
    </section>

    <section id="listview" hidden>
      <button id="back" type="button">← Volver a las categorías</button>
      <div class="cathead">
        <h2 id="catTitle"></h2>
        <a id="catOrg" class="vorg" href="index.html" hidden>Ver este organigrama</a>
      </div>
      <div class="frow">
        <input id="q" type="search" placeholder="Buscar por nombre, cargo u organización…" autocomplete="off"
          aria-label="Buscar en esta categoría">
        <select id="fsub" aria-label="Filtrar por subgrupo (departamento u oficina)">
          <option value="">Todos los subgrupos</option>
        </select>
      </div>
      <div class="frow2" id="frow2" hidden>
        <span class="sub2lab">Subgrupo:</span>
        <select id="fsub2" aria-label="Filtrar por subgrupo de segundo nivel">
          <option value="">Todos</option>
        </select>
      </div>
      <div id="groups"></div>
      <p id="empty" hidden></p>
    </section>
  </main>

  <div id="modal" hidden role="dialog" aria-modal="true" aria-label="Perfil">
    <div class="mbox">
      <button id="mx" type="button" aria-label="Cerrar perfil">✕ Cerrar</button>
      <div class="mhead">
        <img id="mph" alt="">
        <div>
          <h2 id="mname"></h2>
          <div id="mtitle"></div>
          <div id="morg"></div>
          <div id="mdep"></div>
        </div>
      </div>
      <div class="langrow" role="group" aria-label="Idioma del perfil">
        <button type="button" data-l="es" class="on">Español</button>
        <button type="button" data-l="en">English</button>
      </div>
      <div id="mtext"></div>
      <div id="mcontacto" hidden></div>
      <div class="mrow">
        <button id="mword" type="button" class="p">Descargar en Word</button>
        <button id="mcontact" type="button" hidden>Contacto</button>
        <button id="madd" type="button">📁 Agregar a la carpeta</button>
        <button id="mback" type="button">Volver a la lista</button>
        <a id="mdl" hidden></a>
        <button id="mshare" type="button" class="p" hidden>Compartir / Guardar en el celular</button>
      </div>
      <p id="mmsg"></p>
    </div>
  </div>

  <div id="sug" hidden role="dialog" aria-modal="true" aria-label="Sugerencias">
    <div class="mbox">
      <button id="sugx" type="button" aria-label="Cerrar">✕ Cerrar</button>
      <h2 class="sugtitle">Sugerencias</h2>
      <div id="sugStep1">
        <button type="button" class="p sugopt" id="sugOpt">Sugerir perfiles</button>
      </div>
      <form id="sugForm" hidden>
        <label for="sugText">Ayuda a Juan a mejorar esta página con tus sugerencias.</label>
        <textarea id="sugText" rows="10" placeholder="Pega o escribe aquí tu sugerencia, puedes poner lo que sea…"></textarea>
        <div class="mrow">
          <button type="submit" class="p" id="sugSend" disabled>Enviar</button>
          <button type="button" id="sugBack">Volver</button>
        </div>
        <p id="sugMsg"></p>
      </form>
    </div>
  </div>

  <button type="button" id="btnSug" class="sugfab" title="Sugerencias" aria-label="Sugerencias">💡</button>

  <button type="button" id="cartFab" class="cartfab" title="Carpeta de perfiles" aria-label="Carpeta de perfiles">📁<span id="cartN" class="cartn" hidden>0</span></button>
  <button type="button" id="selFab" class="selfab" title="Seleccionar perfiles tocando su tarjeta" aria-label="Seleccionar perfiles para la carpeta">📁➕</button>

  <div id="cartPanel" hidden role="dialog" aria-label="Carpeta de perfiles">
    <div class="cphead"><b>📁 Carpeta de perfiles</b><button id="cartX" type="button" aria-label="Cerrar carpeta">✕</button></div>
    <div id="cartList"></div>
    <p id="cartMsg"></p>
    <div class="mrow">
      <button id="cartGen" type="button" class="p" disabled>Generar ▾</button>
      <a id="cartDl" hidden></a>
      <button id="cartShare" type="button" class="p" hidden>Compartir / Guardar</button>
      <button id="cartClear" type="button">Vaciar</button>
    </div>
    <div id="cartOpts" hidden>
      <button id="cartZip" type="button" disabled>📁 Carpeta con los perfiles en Word (ZIP)</button>
      <button id="cartXlsx" type="button">📊 Matriz en Excel (.xlsx)</button>
    </div>
  </div>

  <div id="zoom" hidden role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <img id="zoomImg" alt="">
    <p>Toca o haz clic para cerrar</p>
  </div>
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/vendor/docx.min.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/photos_ct.js"></script>
  <script src="js/datos_ct.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/repositorio.js?v=11"></script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>

</html>

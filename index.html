<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Repositorio · Embajada de Colombia en Estados Unidos</title>
  <!-- 20 nov 2026 (orden de Juan): el inicio del sitio es repositorio.html.
       Esta página solo redirige allí. El organigrama DOD/JCS vive ahora en
       organigrama.html (los enlaces «Ver organigrama» de los perfiles
       apuntan allí); si la URL trae ?tree=, se conserva y se va al
       organigrama para no romper los enlaces compartidos. -->
  <script>
    try {
      var q = location.search || '';
      if (/(^|[?&])tree=/.test(q)) { location.replace('organigrama.html' + q); }
      else { location.replace('repositorio.html'); }
    } catch (e) { location.replace('repositorio.html'); }
  </script>
  <meta http-equiv="refresh" content="0; url=repositorio.html">
</head>
<body>
  <p>Entrando al Repositorio… Si no se abre solo, <a href="repositorio.html">pulsa aquí</a>.</p>
</body>
</html>
